<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111311"><title>DAYFORM</title>
<style>
:root{--bg:#F7F5EF;--s:#fff;--s2:#EEEBE2;--t:#161814;--m:#6b7166;--a:#4F6B12;--ao:#fff;--b:rgba(0,0,0,.09);--bad:#c0452f;color-scheme:light}
[data-th=dark]{--bg:#111311;--s:#1B1E1A;--s2:#262a24;--t:#F3F3EE;--m:#9aa394;--a:#C8F169;--ao:#111311;--b:rgba(255,255,255,.09);--bad:#ff8a73;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:15px/1.4 Inter,system-ui,Roboto,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#main{flex:1;overflow-y:auto;padding:14px 18px 120px}
nav{display:flex;background:var(--s);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--m);padding:9px 0 7px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav button.on{color:var(--a);font-weight:600}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--a);color:var(--ao);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28)}
h1{font-size:26px;margin:2px 0 14px;font-weight:650;letter-spacing:-.02em}h2{font-size:19px;margin:22px 0 6px}h3{margin:0 0 10px}
.mu{color:var(--m);font-size:13px}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.br{display:flex;gap:8px;align-items:center;color:var(--a);letter-spacing:.18em;font-size:13px}
.ib{background:none;border:0;color:var(--t);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.card{background:var(--s);border:1px solid var(--b);border-radius:18px;padding:14px;margin:8px 0}
.rg0,.rg1{fill:none;stroke-width:6}.rg0{stroke:var(--s2)}.rg1{stroke:var(--a);stroke-linecap:round;transition:stroke-dasharray .4s}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--m);margin:16px 0 2px;font-weight:600}
.row{display:flex;align-items:center;min-height:54px;border-bottom:1px solid var(--b)}.row.dn{opacity:.5}.row.dn .tt{text-decoration:line-through}
.ck{width:44px;height:44px;flex:none;background:none;border:0;padding:0;display:flex;align-items:center;justify-content:center}
.ck::before{content:"";position:absolute}.ck{position:relative}
.ck span{width:24px;height:24px;border-radius:50%;border:2px solid var(--m);display:flex;align-items:center;justify-content:center;transition:all .18s;color:var(--ao)}
.ck.on span{background:var(--a);border-color:var(--a)}
.rb{flex:1;padding:8px 0;min-width:0}.tt{font-size:16px;overflow-wrap:anywhere}.mt{font-size:12px;color:var(--m)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.bt{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;background:var(--a);color:var(--ao);margin:8px 0;min-height:48px}
.bt.gh{background:var(--s2);color:var(--t)}.bt.dng{background:none;color:var(--bad);border:1px solid var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}.ov[hidden]{display:none}
.sh{background:var(--s);width:100%;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.dg{background:var(--s);width:100%;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
input,select,textarea{width:100%;background:var(--s2);color:var(--t);border:1px solid var(--b);border-radius:12px;padding:12px;font:inherit;margin:4px 0 8px;min-height:44px}
textarea{min-height:70px;resize:vertical}input[type=checkbox],input[type=radio]{width:auto;min-height:0;margin:0}input[type=color]{padding:2px;width:56px}input[type=range]{padding:0}
label.f{display:block;font-size:12px;color:var(--m);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{border:1px solid var(--b);background:var(--s2);color:var(--t);border-radius:20px;padding:8px 13px;font:inherit;font-size:13px;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--a);color:var(--ao);border-color:var(--a)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal .w{font-size:11px;color:var(--m);padding:4px 0}
.cd{background:none;border:1px solid transparent;border-radius:12px;color:var(--t);font:inherit;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cd.o{opacity:.3}.cd.td{border-color:var(--a);color:var(--a);font-weight:700}.cd.sl{background:var(--a);color:var(--ao)}.cd i{width:5px;height:5px;border-radius:50%;display:inline-block;margin:0 1px}
.cd .ds{height:5px;display:flex}
.ps{background:none;border:0;width:100%;text-align:left;color:var(--t);font:inherit;display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--m)}
.li{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--b);background:none;border-left:0;border-right:0;border-top:0;width:100%;color:var(--t);font:inherit;text-align:left;min-height:54px}
.pb{height:6px;background:var(--s2);border-radius:4px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--a)}
.hm{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}.hm b{aspect-ratio:1;border-radius:4px;background:var(--s2);border:0;padding:0}.hm b.d{background:var(--a)}.hm b.n{opacity:.35}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--t);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:9}#toast[hidden]{display:none}#toast button{background:none;border:0;color:var(--bg);font-weight:700;font:inherit;font-weight:700;min-height:40px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat .card{margin:0}.stat b{font-size:24px;display:block}
</style></head><body>
<div id="app"><main id="main"></main><button id="fab" aria-label="Quick add" onclick="newItem('task')"></button><nav id="nav"></nav></div>
<div id="sheet" class="ov" hidden></div><div id="dlg" class="ov" hidden style="z-index:8"></div><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const dn=s=>{const[a,b,c]=s.split('-').map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)};
const today=()=>ds(new Date()),addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)},dim=(y,m)=>new Date(y,m,0).getDate();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const P={check:'M5 12.5l4.5 4.5L19 7',plus:'M12 5v14M5 12h14',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',rep:'M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3',bulb:'M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z',more:'M5 12h.01M12 12h.01M19 12h.01',l:'M15 5l-7 7 7 7',r:'M9 5l7 7-7 7',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',flame:'M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z',target:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',set:'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4',db:'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6',book:'M5 4h12a2 2 0 012 2v14H7a2 2 0 01-2-2zM5 18a2 2 0 012-2h12'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4a12 12 0 1 1-8.5 3.5"/><path d="M11 17l4 4 7-9"/></svg>`;
/* ---------- storage (IndexedDB, on-device) ---------- */
const idb=new Promise((res,rej)=>{const q=indexedDB.open('dayform',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const kvGet=async k=>{const db=await idb;return new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})};
const kvSet=async(k,v)=>{const db=await idb;return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const CATS=[['Personal','#C8F169'],['Work','#7fb3ff'],['Learning','#f2c46d'],['Health','#ff9f8a'],['Fitness','#7be0b5'],['Finance','#c9a7ff'],['Other','#9aa394']];
const DEF=()=>({app:'dayform',v:1,tasks:[],done:{},skip:{},habits:[],hl:{},ideas:[],goals:[],plan:{},cats:CATS.map(([n,c])=>({n,c})),prefs:{theme:'system',ws:1,t24:true,pri:1,cat:'Personal'}});
let S,view='today',more='home',sel=today(),cm=today().slice(0,7),hf='all',_u=null,sh=0;
async function save(){try{await kvSet('state',S)}catch(e){toast('Could not save: '+e)}render();sched()}
const col=n=>(S.cats.find(c=>c.n===n)||{c:'#9aa394'}).c;
const fT=t=>{if(!t)return'';if(S.prefs.t24)return t;let[h,m]=t.split(':').map(Number);return `${h%12||12}:${pad(m)} ${h<12?'AM':'PM'}`};
/* ---------- recurrence (pure logic) ---------- */
const isRep=t=>t.rep&&t.rep.type!=='none';
function occ(t,s){if(s<t.date||(t.end&&s>t.end))return false;const r=t.rep;if(!r||r.type==='none')return s===t.date;const iv=Math.max(1,+r.iv||1),[y,m,d]=s.split('-').map(Number),[y0,m0,d0]=t.date.split('-').map(Number);
if(r.type==='daily')return (dn(s)-dn(t.date))%iv===0;
if(r.type==='weekly'){const wd=(pd(s).getDay()+6)%7,w0=(pd(t.date).getDay()+6)%7,days=r.days&&r.days.length?r.days:[w0];if(!days.includes(wd))return false;return Math.floor(((dn(s)-wd)-(dn(t.date)-w0))/7)%iv===0}
if(r.type==='monthly'){if(((y-y0)*12+m-m0)%iv)return false;return d===Math.min(r.dom||d0,dim(y,m))}
if(r.type==='yearly'){if((y-y0)%iv||m!==m0)return false;return d===Math.min(d0,dim(y,m))}return false}
const tasksOn=s=>S.tasks.filter(t=>!t.del&&occ(t,s)&&!S.skip[t.id+'|'+s]).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')||b.pri-a.pri);
const overdue=()=>{const t=today();return S.tasks.filter(x=>!x.del&&!isRep(x)&&x.date<t&&!S.done[x.id+'|'+x.date]).sort((a,b)=>a.date.localeCompare(b.date))};
const rlab=t=>{const r=t.rep;if(!isRep(t))return'';const n=r.iv>1?r.iv:0,u={daily:'day',weekly:'week',monthly:'month',yearly:'year'}[r.type];return n?`Every ${n} ${u}s`:`Every ${u}`};
/* ---------- habits ---------- */
const hdue=(h,s)=>{if(s<h.start)return false;const f=h.freq;if(f.type==='days')return f.days.includes((pd(s).getDay()+6)%7);if(f.type==='interval')return (dn(s)-dn(h.start))%Math.max(1,f.iv)===0;return true};
function streaks(h){let run=0,best=0,t=today();const n=dn(t)-dn(h.start);for(let i=0;i<=Math.min(n,3650);i++){const s=addD(h.start,i);if(!hdue(h,s))continue;if(S.hl[h.id+'|'+s]){run++;best=Math.max(best,run)}else if(s!==t)run=0}return{cur:n<0?0:run,best}}
function hrate(h,days){let d=0,k=0;for(let i=0;i<days;i++){const s=addD(today(),-i);if(hdue(h,s)){d++;if(S.hl[h.id+'|'+s])k++}}return d?Math.round(k/d*100):null}
/* ---------- ui helpers ---------- */
function toast(m,u){_u=u||null;const t=$('#toast');t.innerHTML=`<span>${E(m)}</span>${u?'<button onclick="_u&&_u();$(\'#toast\').hidden=true">Undo</button>':''}`;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,4500)}
function openSheet(h){if(!sh)history.pushState({s:1},'');sh=1;const o=$('#sheet');o.innerHTML=`<div class="sh">${h}</div>`;o.hidden=false;o.onclick=e=>{if(e.target===o)closeSheet()}}
function closeSheet(){if(sh)history.back()}addEventListener('popstate',()=>{sh=0;$('#sheet').hidden=true});
document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center'}),300)});
function ask(t,o){return new Promise(r=>{const d=$('#dlg');d.innerHTML=`<div class="dg"><h3>${t}</h3>${o.map(([k,l])=>`<button class="bt ${k==='del'?'dng':''}" data-k="${k}">${l}</button>`).join('')}<button class="bt gh" data-k="">Cancel</button></div>`;d.hidden=false;d.onclick=e=>{const b=e.target.closest('button');if(b||e.target===d){d.hidden=true;r(b?b.dataset.k||null:null)}}})}
const snap=()=>JSON.stringify(S),undoTo=j=>async()=>{S=JSON.parse(j);await save()};
const chip=(on,fn,l)=>`<button class="chip ${on?'on':''}" onclick="${fn}">${l}</button>`;
const empty=(i,t,b,fn)=>`<div style="text-align:center;padding:36px 10px;color:var(--m)">${ic(i,38)}<p>${t}</p>${b?`<button class="bt" style="width:auto;display:inline-block;padding:12px 22px" onclick="${fn}">${b}</button>`:''}</div>`;
/* ---------- main render ---------- */
function render(){theme();const v={today:vToday,cal:vCal,habits:vHabits,ideas:vIdeas,more:vMore}[view];const m=$('#main'),y=m.scrollTop;m.innerHTML=v();m.scrollTop=y;
$('#fab').innerHTML=ic('plus',26);$('#fab').style.display=view==='more'?'none':'flex';
$('#nav').innerHTML=[['today','check','Today'],['cal','cal','Calendar'],['habits','rep','Habits'],['ideas','bulb','Ideas'],['more','more','More']].map(([k,i,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${ic(i,24)}${l}</button>`).join('');if(view==='ideas')ideaList()}
const go=v=>{view=v;if(v==='more')more='home';render()};
function theme(){const t=S.prefs.theme,d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.th=d?'dark':'light';$('meta[name=theme-color]').content=d?'#111311':'#F7F5EF'}
/* ---------- TODAY ---------- */
function row(t,s,od){const d=!!S.done[t.id+'|'+s],pl=(S.plan[today()]||{}).pri||[],sb=t.sub.length?` · ${t.sub.filter(x=>x.d).length}/${t.sub.length}`:'';
return `<div class="row ${d?'dn':''}"><button class="ck ${d?'on':''}" aria-label="${d?'Mark not done':'Mark done'}: ${E(t.title)}" onclick="tog('${t.id}','${s}')"><span>${d?ic('check',15):''}</span></button><div class="rb" onclick="editTask('${t.id}','${s}')"><div class="tt">${pl.includes(t.id)?ic('star',13)+' ':''}${E(t.title)}</div><div class="mt"><span class="dot" style="background:${col(t.cat)}"></span>${od?'Due '+t.date+' · ':''}${t.time?fT(t.time)+' · ':''}${isRep(t)?rlab(t)+' · ':''}${t.pri==2?'High · ':''}${E(t.cat)}${sb}</div></div></div>`}
function vToday(){const t=today(),d=pd(t),L=tasksOn(t),dd=L.filter(x=>S.done[x.id+'|'+t]),pe=L.filter(x=>!S.done[x.id+'|'+t]),ov=overdue(),pl=S.plan[t]||{},y=S.plan[addD(t,-1)]||{},pct=L.length?Math.round(dd.length/L.length*100):0;
const msg=!L.length?'Nothing planned yet.':pct==100?'All done. Well played.':dd.length?`${L.length-dd.length} to go. Steady wins.`:'A fresh day. Start with one.';
let h=`<div class="hd"><div class="br">${logo(26)}<b>DAYFORM</b></div><button class="ib" aria-label="Search" onclick="searchSheet()">${ic('search')}</button></div><div class="mu">${DAYS[(d.getDay()+6)%7]}, ${MON[d.getMonth()]} ${d.getDate()}</div><h1>Make today count.</h1>
<div class="card" style="display:flex;gap:14px;align-items:center"><svg width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" class="rg0"/><circle cx="30" cy="30" r="26" class="rg1" stroke-dasharray="${pct*1.634} 163.4" transform="rotate(-90 30 30)"/></svg><div><b>${dd.length} of ${L.length} done</b><div class="mu">${msg}</div></div></div>
<button class="ps" onclick="planSheet()">${ic('book',18)}<span>${E(pl.intent||y.tmr||'Plan & reflect on your day')}</span></button><h2>Today</h2>`;
if(!L.length&&!ov.length)h+=empty('cal','Your day is open.','Add your first task',"newItem('task')");
if(ov.length)h+=`<div class="lab" style="color:var(--bad)">Overdue</div>`+ov.map(x=>row(x,x.date,1)).join('');
for(const g of['Morning','Afternoon','Evening','Anytime']){const a=pe.filter(x=>(!x.time?'Anytime':+x.time.slice(0,2)<12?'Morning':+x.time.slice(0,2)<17?'Afternoon':'Evening')===g);if(a.length)h+=`<div class="lab">${g}</div>`+a.map(x=>row(x,t)).join('')}
if(dd.length)h+=`<button class="ps" onclick="tdone=!tdone;render()">Completed (${dd.length}) ${tdone?'▲':'▼'}</button>`+(tdone?dd.map(x=>row(x,t)).join(''):'');return h}
async function tog(id,s){const k=id+'|'+s,was=!!S.done[k];if(was)delete S.done[k];else S.done[k]=Date.now();await save();toast(was?'Marked not done':'Completed',()=>tog(id,s))}
/* ---------- TASK FORM ---------- */
const WD=['M','T','W','T','F','S','S'];
const typeBar=a=>`<div class="chips">${[['task','Task'],['idea','Idea'],['habit','Habit'],['goal','Goal'],['project','Project']].map(([k,l])=>chip(a===k,`newItem('${k}')`,l)).join('')}</div>`;
function newItem(k,pre){({task:()=>taskForm(null,null,pre),idea:()=>ideaForm(null),habit:()=>habitForm(null),goal:()=>goalForm(null,'goal'),project:()=>goalForm(null,'project')})[k]()}
function taskForm(t,od,pre={}){const n=!t;t=t||{title:'',notes:'',date:pre.date||(view==='cal'?sel:today()),time:'',pri:S.prefs.pri,cat:S.prefs.cat,sub:[],rem:false,rep:{type:'none',iv:1,days:[],dom:0},end:'',goal:pre.goal||''};const r=t.rep||{type:'none',iv:1,days:[]};
openSheet(`${n?typeBar('task'):`<h3>Edit task</h3>`}<input id="f_t" placeholder="What needs doing? (try: 'Call mom tomorrow')" value="${E(t.title)}" ${n?'autofocus':''}>
<div style="display:flex;gap:8px"><div style="flex:1"><label class="f" id="f_dl">${isRep(t)?'Starts':'Date'}</label><input id="f_d" type="date" value="${t.date}"></div><div style="flex:1"><label class="f">Time (optional)</label><input id="f_tm" type="time" value="${t.time||''}"></div></div>
<div style="display:flex;gap:8px"><div style="flex:1"><label class="f">Priority</label><select id="f_p">${['Low','Normal','High'].map((x,i)=>`<option value="${i}" ${t.pri==i?'selected':''}>${x}</option>`).join('')}</select></div><div style="flex:1"><label class="f">Category</label><select id="f_c">${S.cats.map(c=>`<option ${c.n===t.cat?'selected':''}>${E(c.n)}</option>`).join('')}</select></div></div>
<label class="f">Repeat</label><select id="f_r" onchange="rv()">${[['none','Does not repeat'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly (same day)'],['yearly','Yearly']].map(([k,l])=>`<option value="${k}" ${r.type===k?'selected':''}>${l}</option>`).join('')}</select>
<div id="rx"><div style="display:flex;gap:8px;align-items:center">Every <input id="f_iv" type="number" min="1" max="365" value="${r.iv||1}" style="width:80px"> <span id="f_u"></span></div><div id="wdc" class="chips">${WD.map((w,i)=>`<label class="chip"><input type="checkbox" name="wd" value="${i}" ${(r.days||[]).includes(i)?'checked':''}>${w}</label>`).join('')}</div><label class="f">Ends (optional)</label><input id="f_e" type="date" value="${t.end||''}"></div>
<label class="f">Notes / description</label><textarea id="f_n">${E(t.notes)}</textarea>
<label class="f">Checklist</label><div id="sbs">${t.sub.map(x=>sbRow(x.t,x.d)).join('')}</div><button class="chip" onclick="$('#sbs').insertAdjacentHTML('beforeend',sbRow('',0))">+ Add item</button>
<label class="f">Linked goal / project</label><select id="f_g"><option value="">None</option>${S.goals.filter(g=>!g.del).map(g=>`<option value="${g.id}" ${t.goal===g.id?'selected':''}>${E(g.title)}</option>`).join('')}</select>
<label class="chip" style="margin:8px 0"><input type="checkbox" id="f_rm" ${t.rem?'checked':''} onchange="if(this.checked)askNotif()"> Remind me at the set time</label>
<button class="bt" onclick="saveTask(${n?'null':`'${t.id}'`},'${od||''}')">${n?'Add task':'Save'}</button>${n?'':`<button class="bt gh" onclick="dupTask('${t.id}')">Duplicate</button><button class="bt gh" onclick="moveTask('${t.id}','${od}')">Move to tomorrow</button><button class="bt dng" onclick="delTask('${t.id}','${od}')">Delete</button>`}`);rv()}
const sbRow=(t,d)=>`<div style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="sd" ${d?'checked':''} style="width:24px;height:24px"><input class="sb" value="${E(t)}" placeholder="Checklist item"></div>`;
function rv(){const v=$('#f_r').value;$('#rx').style.display=v==='none'?'none':'block';$('#wdc').style.display=v==='weekly'?'flex':'none';$('#f_u').textContent={daily:'day(s)',weekly:'week(s)',monthly:'month(s)',yearly:'year(s)'}[v]||'';$('#f_dl').textContent=v==='none'?'Date':'Starts'}
async function askNotif(){const L=window.Capacitor?.Plugins?.LocalNotifications;if(!L){toast('Reminders work in the installed Android app');return}try{const p=await L.requestPermissions();if(p.display!=='granted')toast('Notifications are blocked in Android settings')}catch(e){}}
async function saveTask(id,od){let title=$('#f_t').value.trim();if(!title){$('#f_t').focus();return toast('Give your task a name')}let date=$('#f_d').value||today();
if(!id){const m=title.match(/\s+(today|tomorrow)$/i);if(m){title=title.slice(0,-m[0].length);if(date===today()&&m[1].toLowerCase()==='tomorrow')date=addD(today(),1)}}
const type=$('#f_r').value,days=$$('input[name=wd]:checked').map(x=>+x.value),v={title,notes:$('#f_n').value,date,time:$('#f_tm').value,pri:+$('#f_p').value,cat:$('#f_c').value,goal:$('#f_g').value,rem:$('#f_rm').checked&&!!$('#f_tm').value,end:type==='none'?'':$('#f_e').value,rep:{type,iv:Math.max(1,Math.min(365,+$('#f_iv').value||1)),days:type==='weekly'?days:[],dom:type==='monthly'?pd(date).getDate():0},sub:$$('.sb').map((x,i)=>({t:x.value.trim(),d:$$('.sd')[i].checked})).filter(x=>x.t)};
if(v.end&&v.end<date)return toast('End date is before the start date');
if(!id){S.tasks.push({...v,id:uid(),created:Date.now()})}else{const t=S.tasks.find(x=>x.id===id);let sc='all';if(isRep(t)){sc=await ask('Edit repeating task',[['this','This occurrence only'],['future','This and future occurrences'],['all','Entire series']]);if(!sc)return}
if(sc==='all'||!isRep(t))Object.assign(t,v);else if(sc==='this'){S.skip[t.id+'|'+od]=1;S.tasks.push({...v,id:uid(),date:od,rep:{type:'none',iv:1,days:[],dom:0},end:'',created:Date.now()})}else{if(od<=t.date)Object.assign(t,v);else{t.end=addD(od,-1);S.tasks.push({...v,id:uid(),date:od,created:Date.now()})}}}
closeSheet();await save();if(v.rem)askNotif()}
async function dupTask(id){const t=S.tasks.find(x=>x.id===id);S.tasks.push({...JSON.parse(JSON.stringify(t)),id:uid(),title:t.title+' (copy)',created:Date.now(),sub:t.sub.map(x=>({...x,d:0}))});closeSheet();await save();toast('Duplicated')}
async function moveTask(id,od){const t=S.tasks.find(x=>x.id===id),nd=addD(today(),1),j=snap();if(!isRep(t))t.date=nd;else{S.skip[id+'|'+od]=1;S.tasks.push({...JSON.parse(JSON.stringify(t)),id:uid(),date:nd,rep:{type:'none',iv:1,days:[],dom:0},end:'',created:Date.now()})}closeSheet();await save();toast('Moved to tomorrow',undoTo(j))}
async function delTask(id,od){const t=S.tasks.find(x=>x.id===id),j=snap();if(isRep(t)){const sc=await ask('Delete repeating task',[['this','Only this occurrence'],['future','This and future occurrences'],['del','Entire series']]);if(!sc)return;if(sc==='this')S.skip[id+'|'+od]=1;else if(sc==='future'&&od>t.date)t.end=addD(od,-1);else t.del=1}else{if(!await ask('Delete this task?',[['del','Delete']]))return;t.del=1}closeSheet();await save();toast('Task deleted',undoTo(j))}
const editTask=(id,od)=>taskForm(S.tasks.find(x=>x.id===id),od);
/* ---------- CALENDAR ---------- */
function vCal(){const[y,m]=cm.split('-').map(Number),ws=S.prefs.ws,first=new Date(y,m-1,1),off=(first.getDay()-ws+7)%7,n=dim(y,m),t=today();let c='';
const names=ws?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];c+=names.map(x=>`<div class="w">${x}</div>`).join('');for(let i=0;i<off;i++)c+='<div></div>';let tot=0,dn_=0;
for(let d=1;d<=n;d++){const s=`${y}-${pad(m)}-${pad(d)}`,L=tasksOn(s);let dots='';L.slice(0,3).forEach(x=>{const k=!!S.done[x.id+'|'+s];dots+=`<i style="background:${k?'var(--m)':s<t?'var(--bad)':'var(--a)'};${s===sel?'filter:brightness(0)':''}"></i>`});tot+=L.length;dn_+=L.filter(x=>S.done[x.id+'|'+s]).length;
c+=`<button class="cd ${s===t?'td':''} ${s===sel?'sl':''}" onclick="sel='${s}';render()" aria-label="${s}">${d}<span class="ds">${dots}</span></button>`}
const L=tasksOn(sel);return `<div class="hd"><h1 style="margin:0">${MON[m-1]} ${y}</h1><div><button class="ib" aria-label="Previous month" onclick="cmv(-1)">${ic('l')}</button><button class="ib" aria-label="Next month" onclick="cmv(1)">${ic('r')}</button></div></div>
<div class="cal">${c}</div><button class="chip" style="margin-top:8px" onclick="sel=today();cm=sel.slice(0,7);render()">Jump to today</button>
<div class="card mu">This month: <b style="color:var(--t)">${dn_}</b> completed · <b style="color:var(--t)">${tot-dn_}</b> remaining · <b style="color:var(--t)">${tot?Math.round(dn_/tot*100)+'%':'—'}</b></div>
<h2>${sel===t?'Today':sel}</h2>${L.length?L.map(x=>row(x,sel,0)).join(''):'<p class="mu">Nothing scheduled.</p>'}<button class="bt gh" onclick="taskForm(null,null,{date:sel})">+ Add task on this day</button>`}
function cmv(d){let[y,m]=cm.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}cm=`${y}-${pad(m)}`;render()}
/* ---------- HABITS ---------- */
function vHabits(){const t=today(),L=S.habits.filter(h=>!h.arch);let h=`<div class="hd"><h1 style="margin:0">Habits</h1></div><p class="mu">Habits are tracked separately from tasks. Missing a day is fine, just continue.</p>`;
if(!L.length)h+=empty('rep','Build routines that stick.','Create a habit',"habitForm(null)");
L.forEach(x=>{const due=hdue(x,t),k=!!S.hl[x.id+'|'+t],st=streaks(x);let w='';for(let i=6;i>=0;i--){const s=addD(t,-i);w+=`<i style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:${S.hl[x.id+'|'+s]?x.color:'var(--s2)'}"></i>`}
h+=`<div class="row" style="opacity:${due?1:.6}"><button class="ck ${k?'on':''}" ${due?'':'disabled'} aria-label="Toggle ${E(x.name)}" onclick="hlog('${x.id}','${t}')"><span style="${k?`background:${x.color};border-color:${x.color}`:''}">${k?ic('check',15):''}</span></button><div class="rb" onclick="habitDetail('${x.id}')"><div class="tt">${E(x.name)}</div><div class="mt">${due?'':'Rest day · '}${ic('flame',12)} ${st.cur} day streak · best ${st.best}</div><div style="margin-top:4px">${w}</div></div></div>`});
const ar=S.habits.filter(x=>x.arch);if(ar.length)h+=`<div class="lab">Archived</div>`+ar.map(x=>`<button class="li" onclick="habitDetail('${x.id}')">${E(x.name)}</button>`).join('');return h}
async function hlog(id,s){const k=id+'|'+s;if(S.hl[k])delete S.hl[k];else S.hl[k]=Date.now();await save()}
function habitForm(h){const n=!h;h=h||{name:'',color:'#C8F169',freq:{type:'daily',days:[],iv:2},start:today(),rem:false,remTime:'08:00'};
openSheet(`${n?typeBar('habit'):'<h3>Edit habit</h3>'}<input id="h_n" placeholder="e.g. Read 20 minutes" value="${E(h.name)}"><label class="f">Colour</label><input id="h_c" type="color" value="${h.color}">
<label class="f">Frequency</label><select id="h_f" onchange="hv()"><option value="daily" ${h.freq.type==='daily'?'selected':''}>Every day</option><option value="days" ${h.freq.type==='days'?'selected':''}>Selected weekdays</option><option value="interval" ${h.freq.type==='interval'?'selected':''}>Every N days</option></select>
<div id="h_d" class="chips">${WD.map((w,i)=>`<label class="chip"><input type="checkbox" name="hd" value="${i}" ${h.freq.days.includes(i)?'checked':''}>${w}</label>`).join('')}</div><div id="h_i">Every <input id="h_iv" type="number" min="1" value="${h.freq.iv||2}" style="width:80px"> days</div>
<label class="f">Start date</label><input id="h_s" type="date" value="${h.start}"><label class="chip"><input type="checkbox" id="h_r" ${h.rem?'checked':''} onchange="if(this.checked)askNotif()"> Daily reminder at</label><input id="h_rt" type="time" value="${h.remTime}">
<button class="bt" onclick="saveHabit(${n?'null':`'${h.id}'`})">Save</button>`);hv()}
const hv=()=>{const v=$('#h_f').value;$('#h_d').style.display=v==='days'?'flex':'none';$('#h_i').style.display=v==='interval'?'block':'none'};
async function saveHabit(id){const name=$('#h_n').value.trim();if(!name)return toast('Name your habit');const f=$('#h_f').value,days=$$('input[name=hd]:checked').map(x=>+x.value);if(f==='days'&&!days.length)return toast('Pick at least one weekday');
const v={name,color:$('#h_c').value,freq:{type:f,days,iv:Math.max(1,+$('#h_iv').value||2)},start:$('#h_s').value||today(),rem:$('#h_r').checked,remTime:$('#h_rt').value||'08:00'};if(id)Object.assign(S.habits.find(x=>x.id===id),v);else S.habits.push({...v,id:uid(),arch:0});closeSheet();await save()}
function habitDetail(id){const h=S.habits.find(x=>x.id===id),st=streaks(h),w=hrate(h,7),m=hrate(h,30),t=today();let hm='';for(let i=83;i>=0;i--){const s=addD(t,-i),due=hdue(h,s);hm+=`<b class="${S.hl[id+'|'+s]?'d':due?'':'n'}" ${due?`onclick="hlog('${id}','${s}').then(()=>habitDetail('${id}'))"`:''} style="${S.hl[id+'|'+s]?'background:'+h.color:''}" title="${s}"></b>`}
openSheet(`<h3>${E(h.name)}</h3><div class="stat"><div class="card"><b>${st.cur}</b><span class="mu">Current streak</span></div><div class="card"><b>${st.best}</b><span class="mu">Best streak</span></div><div class="card"><b>${w==null?'—':w+'%'}</b><span class="mu">Last 7 days</span></div><div class="card"><b>${m==null?'—':m+'%'}</b><span class="mu">Last 30 days</span></div></div><p class="mu">Last 12 weeks (tap a day to fix it)</p><div class="hm">${hm}</div>
<button class="bt gh" onclick="habitForm(S.habits.find(x=>x.id==='${id}'))">Edit</button><button class="bt gh" onclick="archHabit('${id}')">${h.arch?'Restore':'Archive (keeps history)'}</button>`)}
async function archHabit(id){const h=S.habits.find(x=>x.id===id);h.arch=h.arch?0:1;closeSheet();await save()}
/* ---------- IDEAS ---------- */
const IS=['Inbox','Exploring','Planned','In Progress','Done','Archived'];let iq='';
function vIdeas(){return `<div class="hd"><h1 style="margin:0">Ideas</h1></div><input id="iq" placeholder="Search ideas, tags…" value="${E(iq)}" oninput="iq=this.value;ideaList()"><div class="chips">${['all',...IS].map(s=>chip(hf===s,`hf='${s}';render()`,s==='all'?'All':s)).join('')}</div><div id="il"></div>`}
function ideaList(){const q=iq.toLowerCase();let L=S.ideas.filter(i=>(hf==='all'?i.status!=='Archived':i.status===hf)&&(!q||(i.title+i.desc+(i.tags||[]).join(' ')+i.cat).toLowerCase().includes(q)));L.sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.created-a.created);
$('#il').innerHTML=L.length?L.map(i=>`<button class="li" onclick="ideaForm('${i.id}')"><div style="flex:1"><div class="tt">${i.pin?ic('star',13)+' ':''}${E(i.title)}</div><div class="mt">${i.status}${i.cat?' · '+E(i.cat):''}${(i.tags||[]).map(x=>' #'+E(x)).join('')}</div></div></button>`).join(''):empty('bulb',S.ideas.length?'No ideas match.':'Capture thoughts now, organise later.',S.ideas.length?'':'Capture an idea',"ideaForm(null)")}
function ideaForm(id){const i=id?S.ideas.find(x=>x.id===id):{title:'',desc:'',cat:'',tags:[],pin:0,status:'Inbox',pri:'',notes:''},n=!id;
openSheet(`${n?typeBar('idea'):'<h3>Idea</h3>'}<input id="i_t" placeholder="Idea title" value="${E(i.title)}" ${n?'autofocus':''}><textarea id="i_d" placeholder="Describe it (optional)">${E(i.desc)}</textarea>
<details ${n?'':'open'}><summary class="mu" style="min-height:40px">More details</summary><label class="f">Status</label><select id="i_s">${IS.map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select><label class="f">Category</label><select id="i_c"><option value="">None</option>${S.cats.map(c=>`<option ${c.n===i.cat?'selected':''}>${E(c.n)}</option>`).join('')}</select><label class="f">Tags (comma separated)</label><input id="i_g" value="${E((i.tags||[]).join(', '))}"><label class="f">Priority</label><select id="i_p"><option value="">None</option>${['Low','Normal','High'].map((x,k)=>`<option value="${k}" ${i.pri===k?'selected':''}>${x}</option>`).join('')}</select><label class="f">Notes</label><textarea id="i_n">${E(i.notes)}</textarea></details>
<label class="chip" style="margin:8px 0"><input type="checkbox" id="i_pin" ${i.pin?'checked':''}> Pin to top</label><button class="bt" onclick="saveIdea(${n?'null':`'${id}'`})">Save</button>
${n?'':`<button class="bt gh" onclick="ideaTask('${id}')">Convert to task</button><button class="bt gh" onclick="ideaGoal('${id}','project')">Turn into project</button><button class="bt gh" onclick="ideaGoal('${id}','goal')">Turn into goal</button><button class="bt gh" onclick="ideaArch('${id}')">${i.status==='Archived'?'Restore':'Archive'}</button><button class="bt dng" onclick="ideaDel('${id}')">Delete</button>`}`)}
async function saveIdea(id){const title=$('#i_t').value.trim();if(!title)return toast('Give the idea a title');const p=$('#i_p').value,v={title,desc:$('#i_d').value,status:$('#i_s').value,cat:$('#i_c').value,tags:$('#i_g').value.split(',').map(x=>x.trim()).filter(Boolean),pri:p===''?'':+p,notes:$('#i_n').value,pin:$('#i_pin').checked?1:0};if(id)Object.assign(S.ideas.find(x=>x.id===id),v);else S.ideas.push({...v,id:uid(),created:Date.now()});closeSheet();await save()}
async function ideaTask(id){const i=S.ideas.find(x=>x.id===id);S.tasks.push({id:uid(),title:i.title,notes:i.desc,date:today(),time:'',pri:S.prefs.pri,cat:i.cat||S.prefs.cat,sub:[],rem:false,rep:{type:'none',iv:1,days:[],dom:0},end:'',goal:'',created:Date.now(),idea:id});if(i.status==='Inbox'||i.status==='Exploring')i.status='Planned';closeSheet();await save();toast('Added to Today')}
async function ideaGoal(id,k){const i=S.ideas.find(x=>x.id===id);S.goals.push({id:uid(),kind:k,title:i.title,desc:i.desc,date:'',cat:i.cat,status:k==='project'?'Planned':'Active',prog:0,created:Date.now()});i.status='In Progress';closeSheet();await save();toast(k==='project'?'Project created':'Goal created')}
async function ideaArch(id){const i=S.ideas.find(x=>x.id===id);i.status=i.status==='Archived'?'Inbox':'Archived';closeSheet();await save()}
async function ideaDel(id){if(!await ask('Delete this idea for good?',[['del','Delete']]))return;const j=snap();S.ideas=S.ideas.filter(x=>x.id!==id);closeSheet();await save();toast('Idea deleted',undoTo(j))}
/* ---------- GOALS & PROJECTS ---------- */
const GS=['Planned','Active','Paused','Completed'];
function gprog(g){const ts=S.tasks.filter(t=>!t.del&&t.goal===g.id&&!isRep(t));if(!ts.length)return{p:g.prog||0,auto:0};const d=ts.filter(t=>S.done[t.id+'|'+t.date]).length;return{p:Math.round(d/ts.length*100),auto:1,n:ts.length,d}}
function goalForm(id,kind){const g=id?S.goals.find(x=>x.id===id):{title:'',desc:'',date:'',cat:'',status:kind==='project'?'Planned':'Active',prog:0,kind},n=!id,gp=id?gprog(g):{p:0,auto:0};
openSheet(`${n?typeBar(kind):`<h3>${g.kind==='project'?'Project':'Goal'}</h3>`}<input id="g_t" placeholder="Title" value="${E(g.title)}"><textarea id="g_d" placeholder="Description">${E(g.desc)}</textarea><label class="f">${g.kind==='project'?'Deadline':'Target date'} (optional)</label><input id="g_dt" type="date" value="${g.date}"><label class="f">Status</label><select id="g_s">${GS.map(s=>`<option ${g.status===s?'selected':''}>${s}</option>`).join('')}</select>
<label class="f">Category</label><select id="g_c"><option value="">None</option>${S.cats.map(c=>`<option ${c.n===g.cat?'selected':''}>${E(c.n)}</option>`).join('')}</select>
${gp.auto?`<p class="mu">Progress ${gp.p}% (from ${gp.d}/${gp.n} linked tasks)</p>`:`<label class="f">Progress: <span id="g_pv">${g.prog||0}</span>%</label><input id="g_p" type="range" min="0" max="100" value="${g.prog||0}" oninput="$('#g_pv').textContent=this.value">`}
<button class="bt" onclick="saveGoal(${n?'null':`'${id}'`},'${g.kind}')">Save</button>${n?'':`<button class="bt gh" onclick="closeSheet();setTimeout(()=>taskForm(null,null,{goal:'${id}'}),350)">Add linked task</button><button class="bt dng" onclick="delGoal('${id}')">Delete (tasks are kept)</button>`}`)}
async function saveGoal(id,kind){const title=$('#g_t').value.trim();if(!title)return toast('Add a title');const v={title,desc:$('#g_d').value,date:$('#g_dt').value,status:$('#g_s').value,cat:$('#g_c').value,kind};if($('#g_p'))v.prog=+$('#g_p').value;if(id)Object.assign(S.goals.find(x=>x.id===id),v);else S.goals.push({...v,id:uid(),prog:v.prog||0,created:Date.now()});closeSheet();await save()}
async function delGoal(id){if(!await ask('Delete this?',[['del','Delete']]))return;const j=snap();S.goals.find(x=>x.id===id).del=1;S.tasks.forEach(t=>{if(t.goal===id)t.goal=''});closeSheet();await save();toast('Deleted',undoTo(j))}
function pGoals(){const L=S.goals.filter(g=>!g.del);return `<div class="hd"><h1 style="margin:0">Goals & projects</h1></div>`+(L.length?['project','goal'].map(k=>{const a=L.filter(g=>g.kind===k);return a.length?`<div class="lab">${k==='project'?'Projects':'Goals'}</div>`+a.map(g=>{const p=gprog(g);return `<button class="li" style="display:block" onclick="goalForm('${g.id}','${g.kind}')"><div class="tt">${E(g.title)}</div><div class="mt">${g.status}${g.date?' · due '+g.date:''} · ${p.p}%</div><div class="pb"><i style="width:${p.p}%"></i></div></button>`}).join(''):''}).join(''):empty('target','Goals and projects live here.','New goal',"goalForm(null,'goal')"))+`<button class="bt gh" onclick="goalForm(null,'project')">+ New project</button>`}
/* ---------- PLAN & REFLECTION ---------- */
function planSheet(){const t=today(),p=S.plan[t]||{},L=tasksOn(t),dd=L.filter(x=>S.done[x.id+'|'+t]).length;
openSheet(`<h3>Plan & reflect</h3><label class="f">Today's intention</label><input id="p_i" value="${E(p.intent||'')}" placeholder="What matters today?"><label class="f">Top priorities (up to 3)</label>${L.length?L.map(x=>`<label class="chip" style="display:flex;margin:4px 0"><input type="checkbox" class="pp" value="${x.id}" ${(p.pri||[]).includes(x.id)?'checked':''} onchange="if($$('.pp:checked').length>3){this.checked=false;toast('Three is plenty')}"> ${E(x.title)}</label>`).join(''):'<p class="mu">Add tasks to pick priorities.</p>'}
<label class="f">Note</label><textarea id="p_n">${E(p.note||'')}</textarea><div class="lab">End of day · ${dd} of ${L.length} tasks done</div><label class="f">What went well</label><textarea id="p_w">${E(p.well||'')}</textarea><label class="f">What could be better</label><textarea id="p_b">${E(p.better||'')}</textarea><label class="f">Intention for tomorrow</label><input id="p_t" value="${E(p.tmr||'')}"><button class="bt" onclick="savePlan()">Save</button><p class="mu">Optional. Stays on your device.</p>`)}
async function savePlan(){S.plan[today()]={intent:$('#p_i').value.trim(),pri:$$('.pp:checked').map(x=>x.value),note:$('#p_n').value,well:$('#p_w').value,better:$('#p_b').value,tmr:$('#p_t').value.trim()};closeSheet();await save()}
function pPlans(){const k=Object.keys(S.plan).sort().reverse();return `<h1>Daily plans & reflections</h1>`+(k.length?k.map(d=>{const p=S.plan[d];return `<div class="card"><b>${d}</b>${p.intent?`<div>Intention: ${E(p.intent)}</div>`:''}${p.well?`<div class="mu">Went well: ${E(p.well)}</div>`:''}${p.better?`<div class="mu">Improve: ${E(p.better)}</div>`:''}${p.tmr?`<div class="mu">Tomorrow: ${E(p.tmr)}</div>`:''}${p.note?`<div class="mu">${E(p.note)}</div>`:''}</div>`}).join(''):empty('book','No plans or reflections yet. They are optional.'))}
/* ---------- STATS ---------- */
function bars(v,l){const W=300,H=90,mx=Math.max(1,...v),w=W/v.length;return `<svg viewBox="0 0 ${W} ${H+16}" width="100%">${v.map((x,i)=>`<rect x="${i*w+3}" y="${H-x/mx*H}" width="${w-6}" height="${Math.max(2,x/mx*H)}" rx="3" fill="${x?'var(--a)':'var(--s2)'}"/><text x="${i*w+w/2}" y="${H+12}" font-size="8" text-anchor="middle" fill="var(--m)">${l[i]}</text>`).join('')}</svg>`}
function pStats(){const t=today(),ev=Object.entries(S.done).filter(([k])=>S.tasks.some(x=>x.id===k.split('|')[0]&&!x.del)).map(([,v])=>new Date(v)),c=f=>ev.filter(f).length,wk=addD(t,-((pd(t).getDay()+6)%7));
let due=0,dn_=0;for(let i=0;i<30;i++){const s=addD(t,-i);tasksOn(s).forEach(x=>{due++;if(S.done[x.id+'|'+s])dn_++})}let hd=0,hk=0;S.habits.filter(h=>!h.arch).forEach(h=>{for(let i=0;i<30;i++){const s=addD(t,-i);if(hdue(h,s)){hd++;if(S.hl[h.id+'|'+s])hk++}}});
const v=[],l=[];for(let i=13;i>=0;i--){const s=addD(t,-i);v.push(ev.filter(d=>ds(d)===s).length);l.push(pd(s).getDate())}
const wd=[0,0,0,0,0,0,0];ev.forEach(d=>wd[(d.getDay()+6)%7]++);const up=[...Array(7)].reduce((a,_,i)=>a+tasksOn(addD(t,i+1)).length,0);
return `<h1>Insights</h1><p class="mu">Tasks and habits are counted separately. Everything comes from your recorded activity.</p><div class="lab">Tasks</div><div class="stat"><div class="card"><b>${c(d=>ds(d)===t)}</b><span class="mu">Done today</span></div><div class="card"><b>${c(d=>ds(d)>=wk)}</b><span class="mu">This week</span></div><div class="card"><b>${c(d=>ds(d).slice(0,7)===t.slice(0,7))}</b><span class="mu">This month</span></div><div class="card"><b>${due?Math.round(dn_/due*100)+'%':'—'}</b><span class="mu">Completion, 30 days</span></div><div class="card"><b>${up}</b><span class="mu">Due next 7 days</span></div><div class="card"><b style="color:var(--bad)">${overdue().length}</b><span class="mu">Overdue</span></div></div>
<div class="lab">Last 14 days (tasks completed)</div>${ev.length?bars(v,l):'<p class="mu">Complete a task to start your history.</p>'}
<div class="lab">Most productive weekdays</div>${ev.length>=5?bars(wd,'MTWTFSS'.split('')):'<p class="mu">Needs a few more completions to be meaningful.</p>'}
<div class="lab">Habits</div><div class="card">Habit completion (30 days): <b>${hd?Math.round(hk/hd*100)+'%':'—'}</b></div>${S.habits.filter(h=>!h.arch).map(h=>{const s=streaks(h);return `<div class="row"><div class="rb"><div class="tt">${E(h.name)}</div><div class="mt">Current ${s.cur} · Best ${s.best}</div></div></div>`}).join('')||'<p class="mu">No habits yet.</p>'}`}
/* ---------- MORE / SETTINGS / DATA ---------- */
function vMore(){const back=`<button class="chip" onclick="more='home';render()">← Back</button>`;
if(more==='stats')return back+pStats();if(more==='goals')return back+pGoals();if(more==='plans')return back+pPlans();if(more==='data')return back+pData();if(more==='set')return back+pSet();
return `<h1>More</h1>`+[['stats','chart','Insights','Statistics and streaks'],['goals','target','Goals & projects','Long-term progress'],['plans','book','Plans & reflections','Your daily history'],['data','db','Backup & data','Export, restore, privacy'],['set','set','Settings','Theme, defaults, categories']].map(([k,i,a,b])=>`<button class="li" onclick="more='${k}';render()">${ic(i)}<div><div class="tt">${a}</div><div class="mt">${b}</div></div></button>`).join('')+`<p class="mu" style="margin-top:24px">DAYFORM 1.0.0 · Own your day. Shape your life.<br>Everything stays on this device. No account, no server.</p>`}
const opt=(v,c,l)=>`<option value="${v}" ${c?'selected':''}>${l}</option>`;
function pSet(){const p=S.prefs;return `<h1>Settings</h1><label class="f">Theme</label><select onchange="setP('theme',this.value)">${[['system','System'],['light','Light'],['dark','Dark']].map(([k,l])=>opt(k,p.theme===k,l)).join('')}</select><label class="f">Week starts on</label><select onchange="setP('ws',+this.value)">${opt(1,p.ws===1,'Monday')}${opt(0,p.ws===0,'Sunday')}</select><label class="f">Time format</label><select onchange="setP('t24',this.value==='1')">${opt(1,p.t24,'24-hour')}${opt(0,!p.t24,'12-hour')}</select>
<label class="f">Default priority</label><select onchange="setP('pri',+this.value)">${['Low','Normal','High'].map((x,i)=>opt(i,p.pri===i,x)).join('')}</select><label class="f">Default category</label><select onchange="setP('cat',this.value)">${S.cats.map(c=>opt(E(c.n),c.n===p.cat,E(c.n))).join('')}</select>
<div class="lab">Categories</div>${S.cats.map(c=>`<div class="row"><span class="dot" style="background:${c.c};width:14px;height:14px"></span><div class="rb">${E(c.n)}</div>${S.cats.length>1?`<button class="ib" aria-label="Remove ${E(c.n)}" onclick="delCat('${E(c.n)}')">✕</button>`:''}</div>`).join('')}<div style="display:flex;gap:8px;align-items:center"><input id="nc" placeholder="New category"><input id="ncc" type="color" value="#C8F169"><button class="chip" onclick="addCat()">Add</button></div>
<div class="lab">Reminders</div><p class="mu">Reminders are scheduled on-device for the next 14 days and refreshed whenever you open the app. Android may delay notifications slightly to save battery, so they may not arrive to the exact minute.</p>`}
async function setP(k,v){S.prefs[k]=v;await save()}
async function addCat(){const n=$('#nc').value.trim();if(!n||S.cats.some(c=>c.n.toLowerCase()===n.toLowerCase()))return toast('Enter a new name');S.cats.push({n,c:$('#ncc').value});await save()}
async function delCat(n){S.cats=S.cats.filter(c=>c.n!==n);if(S.prefs.cat===n)S.prefs.cat=S.cats[0].n;await save()}
function pData(){return `<h1>Backup & data</h1><div class="card"><b>Where is my data?</b><p class="mu">Inside the DAYFORM app's private storage on this phone. Nothing is uploaded anywhere. Uninstalling the app erases it, so back up first. Backups are never automatic: you create them here.</p></div><button class="bt" onclick="expJ()">Export backup (JSON)</button><button class="bt gh" onclick="expC()">Export tasks (CSV)</button><button class="bt gh" onclick="$('#imp').click()">Restore from backup</button><input id="imp" type="file" accept=".json,application/json" hidden onchange="imp(this.files[0]);this.value=''"><button class="bt dng" onclick="wipe()">Clear all data</button>`}
async function out(name,text,mime){const C=window.Capacitor?.Plugins;try{if(C?.Filesystem&&C?.Share){const r=await C.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});await C.Share.share({title:name,url:r.uri,dialogTitle:'Choose where to save'});return}}catch(e){if(/cancel/i.test(String(e)))return;toast('Share failed: '+e);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click()}
const expJ=()=>out(`dayform-backup-${today()}.json`,JSON.stringify(S,null,1),'application/json');
function expC(){const q=x=>`"${String(x??'').replace(/"/g,'""')}"`,h='title,date,time,priority,category,repeat,end,notes,completed_dates\n';const r=S.tasks.filter(t=>!t.del).map(t=>[t.title,t.date,t.time,['Low','Normal','High'][t.pri],t.cat,rlab(t)||'None',t.end,t.notes,Object.keys(S.done).filter(k=>k.startsWith(t.id+'|')).map(k=>k.split('|')[1]).join(' ')].map(q).join(','));out(`dayform-tasks-${today()}.csv`,h+r.join('\n'),'text/csv')}
function imp(f){if(!f)return;const r=new FileReader();r.onload=async()=>{let j;try{j=JSON.parse(r.result)}catch{return toast('That file is not valid JSON')}const ok=j&&j.app==='dayform'&&['tasks','habits','ideas','goals'].every(k=>Array.isArray(j[k]))&&['done','skip','hl','plan'].every(k=>j[k]&&typeof j[k]==='object')&&j.tasks.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&/^\d{4}-\d\d-\d\d$/.test(t.date));if(!ok)return toast('This is not a valid DAYFORM backup');
const k=await ask(`Backup holds ${j.tasks.length} tasks, ${j.habits.length} habits, ${j.ideas.length} ideas, ${j.goals.length} goals.`,[['rep','Replace all current data'],['mer','Merge into current data']]);if(!k)return;const base=DEF();
if(k==='rep')S={...base,...j,prefs:{...base.prefs,...j.prefs}};else{for(const a of['tasks','habits','ideas','goals']){const ids=new Set(S[a].map(x=>x.id));S[a]=S[a].concat(j[a].filter(x=>!ids.has(x.id)))}for(const o of['done','skip','hl','plan'])S[o]={...j[o],...S[o]};const cn=new Set(S.cats.map(c=>c.n));(j.cats||[]).forEach(c=>{if(!cn.has(c.n))S.cats.push(c)})}await save();toast('Backup restored')};r.readAsText(f)}
async function wipe(){const a=await ask('Delete ALL tasks, habits, ideas and notes from this phone?',[['go','Yes, continue']]);if(!a)return;const b=prompt('Type DELETE to confirm erasing everything');if(b!=='DELETE')return toast('Cancelled, nothing was erased');S=DEF();await save();toast('All data cleared')}
/* ---------- SEARCH ---------- */
let sq='',st_='all',ss='any',sc='';
function searchSheet(){openSheet(`<input id="sq" placeholder="Search tasks, ideas, habits, goals" value="${E(sq)}" oninput="sq=this.value;runS()" autofocus><div style="display:flex;gap:6px"><select onchange="st_=this.value;runS()">${[['all','Everything'],['task','Tasks'],['idea','Ideas'],['habit','Habits'],['goal','Goals/projects']].map(([k,l])=>opt(k,st_===k,l)).join('')}</select><select onchange="ss=this.value;runS()">${[['any','Any status'],['open','Open tasks'],['done','Done tasks'],['high','High priority']].map(([k,l])=>opt(k,ss===k,l)).join('')}</select></div><select onchange="sc=this.value;runS()"><option value="">All categories</option>${S.cats.map(c=>opt(E(c.n),sc===c.n,E(c.n))).join('')}</select><div id="sr"></div>`);runS()}
function runS(){const q=sq.toLowerCase(),r=[],has=x=>!q||x.toLowerCase().includes(q);
if(st_==='all'||st_==='task')S.tasks.filter(t=>!t.del&&has(t.title+' '+t.notes)&&(!sc||t.cat===sc)).forEach(t=>{const d=isRep(t)?!1:!!S.done[t.id+'|'+t.date];if(ss==='open'&&d||ss==='done'&&!d||ss==='high'&&t.pri!==2)return;r.push(`<button class="li" onclick="editTask('${t.id}','${t.date}')">${ic('check',18)}<div><div class="tt">${E(t.title)}</div><div class="mt">Task · ${t.date}${d?' · done':''}</div></div></button>`)});
if(ss==='any'&&!sc){if(st_==='all'||st_==='idea')S.ideas.filter(i=>has(i.title+i.desc+(i.tags||[]).join(' '))).forEach(i=>r.push(`<button class="li" onclick="ideaForm('${i.id}')">${ic('bulb',18)}<div><div class="tt">${E(i.title)}</div><div class="mt">Idea · ${i.status}</div></div></button>`));
if(st_==='all'||st_==='habit')S.habits.filter(h=>has(h.name)).forEach(h=>r.push(`<button class="li" onclick="habitDetail('${h.id}')">${ic('rep',18)}<div><div class="tt">${E(h.name)}</div><div class="mt">Habit</div></div></button>`));
if(st_==='all'||st_==='goal')S.goals.filter(g=>!g.del&&has(g.title+g.desc)).forEach(g=>r.push(`<button class="li" onclick="goalForm('${g.id}','${g.kind}')">${ic('target',18)}<div><div class="tt">${E(g.title)}</div><div class="mt">${g.kind}</div></div></button>`))}
$('#sr').innerHTML=r.slice(0,60).join('')||'<p class="mu">No matches.</p>'}
/* ---------- local notifications (Android app) ---------- */
async function sched(){const L=window.Capacitor?.Plugins?.LocalNotifications;if(!L)return;try{const p=await L.checkPermissions();if(p.display!=='granted')return;const pe=await L.getPending();if(pe.notifications.length)await L.cancel({notifications:pe.notifications.map(n=>({id:n.id}))});const list=[],now=Date.now();let id=1;
for(let i=0;i<14;i++){const s=addD(today(),i);S.tasks.forEach(t=>{if(!t.del&&t.rem&&t.time&&occ(t,s)&&!S.skip[t.id+'|'+s]&&!S.done[t.id+'|'+s]){const at=new Date(s+'T'+t.time);if(at>now)list.push({id:id++,title:'DAYFORM',body:t.title,schedule:{at,allowWhileIdle:true}})}});
S.habits.forEach(h=>{if(!h.arch&&h.rem&&hdue(h,s)&&!S.hl[h.id+'|'+s]){const at=new Date(s+'T'+h.remTime);if(at>now)list.push({id:id++,title:'DAYFORM habit',body:h.name,schedule:{at,allowWhileIdle:true}})}})}
if(list.length)await L.schedule({notifications:list.slice(0,400)})}catch(e){}}
/* ---------- boot ---------- */
(async()=>{try{const d=await kvGet('state');S=Object.assign(DEF(),d||{});S.prefs=Object.assign(DEF().prefs,S.prefs||{})}catch(e){S=DEF()}
render();sched();document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();sched()}});matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme)})();
</script></body></html>
